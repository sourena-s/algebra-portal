<title>ALGEBRA on a SMRT Cell</title>
<meta name="author" content="Sourena Soheili-Nezhad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200..800&family=Michroma&family=Orbitron:wght@600&family=Syncopate:wght@700&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#04060B; --bone:#ECE6DA; --dust:#8C95A8; --hair:rgba(236,230,218,.16); --glass:rgba(10,14,24,.72); --gold:#FFC46B; --leo:#8FC3FF;
  --sans:'Univia Pro','univia-pro','Exo 2',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--bone);font-family:var(--sans);font-size:12px;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header,.bar{padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
header{padding-block:14px 10px;justify-content:space-between}
.mark{font-weight:200;font-size:20px;letter-spacing:.08em}
.mark b{font-weight:200;color:#FF5B3A}
.sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}
.seg .face-syn{font-family:"Syncopate",var(--sans);font-weight:700}.seg .face-mic{font-family:"Michroma",var(--sans);font-weight:400}.seg .face-orb{font-family:"Orbitron",var(--sans);font-weight:600}.seg .face-uni{font-family:"Univia Pro","univia-pro",var(--sans)}
.stage{position:relative;min-height:0;display:grid;place-items:center;padding-inline:16px}
#cv{display:block;max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--hair)}
.bar{padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);background:var(--glass)}
.field{display:flex;align-items:center;gap:8px}
.lbl{font-size:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dust)}
input[type=text]{font:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;width:11ch;padding:7px 10px;background:transparent;color:var(--bone);border:1px solid var(--hair)}
.seg{display:flex;border:1px solid var(--hair)}
.seg button,.go{font:inherit;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:8px 11px;background:transparent;color:var(--dust);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--hair)}
.seg button[aria-pressed=true]{color:var(--void);background:var(--bone)}
.seg button:hover:not([aria-pressed=true]),.go:hover{color:var(--bone)}
.go{margin-left:auto;color:var(--void);background:var(--bone);padding:9px 16px}
.go:hover{background:#FFF3DC;color:var(--void)}
button:focus-visible,input:focus-visible{outline:1px solid var(--leo);outline-offset:2px}
.shot{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:16px;background:rgba(4,6,11,.94)}
.shot div{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dust)}
.shot img{max-width:100%;max-height:100%;margin:auto;display:block;min-height:0;box-shadow:0 0 0 1px var(--hair)}
@media (max-width:640px){ .go{margin-left:0} header{flex-direction:column;align-items:flex-start;gap:4px} }
</style>

<header>
  <div><span class="mark"><b>A</b>LGEBRA</span> <span class="sub">&nbsp;SMRT Cell · 192 × 120 zero-mode waveguides</span></div>
</header>
<div class="stage"><canvas id="cv" aria-label="A PacBio SMRT Cell seen at an angle, with the instrument camera drawn in blue lines above it; the lit wells spell ALGEBRA"></canvas></div>
<div class="bar">
  <label class="field" for="txt"><span class="lbl">Wells spell</span><input type="text" id="txt" value="ALGEBRA" maxlength="10" spellcheck="false" autocomplete="off"></label>
  <div class="field"><span class="lbl">Type</span><div class="seg" id="face" role="group" aria-label="Typeface of the letters">
    <button type="button" class="face-syn" data-t="syn" aria-pressed="true">Syncopate</button><button type="button" class="face-mic" data-t="mic" aria-pressed="false">Michroma</button><button type="button" class="face-orb" data-t="orb" aria-pressed="false">Orbitron</button><button type="button" class="face-uni" data-t="uni" id="faceUni" aria-pressed="false" hidden>Univia Pro</button></div></div>
  <div class="field"><span class="lbl">Format</span><div class="seg" id="fmt" role="group" aria-label="Format">
    <button type="button" data-f="3840x2160" aria-pressed="true">16:9</button><button type="button" data-f="3840x2400" aria-pressed="false">16:10</button><button type="button" data-f="2048x2048" aria-pressed="false">1:1</button><button type="button" data-f="1440x3120" aria-pressed="false">Phone</button></div></div>
  <div class="field"><span class="lbl">Light</span><div class="seg" id="pal" role="group" aria-label="Colour of the lit wells">
    <button type="button" data-p="0" aria-pressed="true">Dyes</button><button type="button" data-p="1" aria-pressed="false">White</button></div></div>
  <button type="button" class="go" id="save">Render full size</button>
</div>
<div class="shot" id="shot" hidden>
  <div><span id="shotTxt">Right-click or long-press the image to save it.</span><button type="button" class="go" id="close">Close</button></div>
  <img id="shotImg" alt="Full-size render of the SMRT Cell wallpaper">
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// The last view of chapter VII of ALGEBRA: the SMRT Cell, and over it the instrument's camera, drawn as a blueprint. Only the wells
// under the letters hold a polymerase and glow; the rest are dark. Geometry, shaders and framing are the site's own.
const $ = id => document.getElementById(id), TAU = Math.PI*2, DEG = Math.PI/180;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x04060B, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, 16/9, .05, 500);
const U = { uTime: { value: 0 } };
const smrtGroup = new THREE.Group(); scene.add(smrtGroup);

// ---- the chip: a rectangular die of GX x GZ wells, five points each (a ring of four and the light at its heart), the die's edge,
// the cell's frame round it, a sheen on the aluminium. Sizes are the site's, scaled to the finer pitch.
const HX = 1.6, HZ = 1.0, GX = 192, GZ = 120, K = 5, NW = GX*GZ*K, NP = NW + 30000;
const maskData = new Uint8Array(GX*GZ), maskTex = new THREE.DataTexture(maskData, GX, GZ, THREE.RedFormat, THREE.UnsignedByteType);

const col = h => new THREE.Color(h);
const CU = { uCellT: { value: 3.7 }, uMask: { value: maskTex }, uWhite: { value: 0 }, uScale: { value: 1 }, uPR: { value: 1 },
  uBA: { value: col('#35E07E') }, uBC: { value: col('#4C8DFF') }, uBG: { value: col('#FFC73D') }, uBT: { value: col('#FF4D4D') } };

  const id = new Float32Array(NP); for (let i = 0; i < NP; i++) id[i] = i;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NP*3), 3)); g.setAttribute('aId', new THREE.BufferAttribute(id, 1));
  const f = n => n.toFixed(5);
  const m = new THREE.ShaderMaterial({ uniforms: CU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float aId; uniform float uCellT, uWhite, uScale, uPR; uniform sampler2D uMask; uniform vec3 uBA, uBC, uBG, uBT; varying vec3 vC; varying float vA;
      uint pcg(uint v){ uint s = v*747796405u + 2891336453u, w = ((s >> ((s >> 28u) + 4u)) ^ s)*277803737u; return (w >> 22u) ^ w; }
      float rn(float id, float k){ return float(pcg(uint(id)*8u + uint(k)))/4294967295.; }
      vec3 baseCol(float g){ return g < .5 ? uBA : g < 1.5 ? uBC : g < 2.5 ? uBG : uBT; }
      void main(){
        float GX = ${GX}., GZ = ${GZ}., K = ${K}., HX = ${f(HX)}, HZ = ${f(HZ)}, pitch = 2.*HX/GX, rr = pitch*.3, nW = GX*GZ*K, NP = ${NP}., sc = pitch/.041270;
        vec3 P, C; float A, S; float id = aId;
        if (id < nW){
          float w = floor(id/K), k = id - w*K, i = mod(w, GX), j = floor(w/GX), ang = k/(K - 1.)*6.2832;
          float lit = texelFetch(uMask, ivec2(int(i), int(j)), 0).r;                 // the letters: these wells hold a polymerase
          float cyc = uCellT*(1.6 + 3.2*rn(w, 2.)) + rn(w, 3.)*9., F = lit*(.72 + .28*exp(-fract(cyc)*5.5));
          vec3 lc = mix(baseCol(floor(rn(w, 4.)*4.)), vec3(.93, .96, 1.), uWhite);
          vec3 wc = vec3((i - (GX - 1.)*.5)*pitch, 0., (j - (GZ - 1.)*.5)*pitch);
          if (k < K - 1.5){ P = wc + rr*vec3(cos(ang + .785), 0., sin(ang + .785)); C = mix(vec3(.46, .52, .62), lc, F); A = .16 + .84*F + .06*lit; S = .0062*sc*(1. + .9*F); }
          else { P = wc - vec3(0., .002, 0.); C = mix(lc, vec3(1.), .1); A = 2.1*F; S = .0062*sc*(1.8 + 3.6*F); }
        } else {
          float q = id - nW, f = q/max(NP - nW, 1.), r = rn(id, 1.);
          if (f < .55){                                   // the die's edge, then the cell's frame, both following the rectangle
            bool die = f < .3; float t = (die ? f/.3 : (f - .3)/.25)*4., side = floor(t), u = fract(t)*2. - 1.;
            vec2 e = side < .5 ? vec2(u, -1.) : side < 1.5 ? vec2(1., u) : side < 2.5 ? vec2(-u, 1.) : vec2(-1., -u);
            vec2 R = die ? vec2(HX + .03, HZ + .03) : vec2(HX + .32, HZ + .32);
            P = vec3(e.x*R.x, die ? -.004 : -.05, e.y*R.y); C = die ? vec3(.75, .8, .9) : vec3(.55, .6, .7); A = die ? .55 : .28; S = die ? .006 : .005;
          } else { P = vec3((rn(id, 2.) - .5)*2.*HX, -.002, (rn(id, 3.) - .5)*2.*HZ); C = vec3(.5, .56, .66); A = .07 + .09*r; S = .004; }
        }

        float px = S*uScale/-mv.z*uPR, drawn = clamp(px, 2., 18.*uPR);

      }`,
    fragmentShader: `varying vec3 vC; varying float vA; void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c)*4.; if (d > 1.) discard;
      gl_FragColor = vec4(vC, vA*(exp(-d*2.6) - .0743)/.9257); }` });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; smrtGroup.add(pts);
}

// ---- the instrument's camera, exactly as the site builds it
const smrtCam = (() => {
  const g = new THREE.Group(); g.visible = false; smrtGroup.add(g);
  const H = 2.1, D = 1.34;                             // (the lens's front over the cell; the half-width of what it sees)
  const blue = new THREE.LineBasicMaterial({ color: new THREE.Color(.2, .45, .95), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const halo = blue.clone(); halo.color = new THREE.Color(.1, .25, .6);
  const seg = (pts, m) => { const geo = new THREE.BufferGeometry().setFromPoints(pts); const l = new THREE.LineSegments(geo, m); l.renderOrder = 4; l.frustumCulled = false; return l; };
  const V = (x, y, z) => new THREE.Vector3(x, y, z), P = [];
  // The camera of the blueprint: a full-frame interchangeable-lens body, 138 x 96 x 76 mm, with a 16 mm f/1.8 wide-angle lens and its
  // petal hood, drawn as the blueprint draws it: every surface meshed in a fine grid. Built in millimetres, in the camera's own frame
  // (x across the body, y along the lens axis from the hood's rim up to the back of the body, z from the base plate to the top).
  const u = .0054, W = (x, y, z) => V(x*u, H + (y - 24)*u, z*u), L = (a, b) => P.push(W(...a), W(...b));
  const loop = pts => { for (let i = 0; i < pts.length; i++) L(pts[i], pts[(i + 1)%pts.length]); };
  // the lens, turned: rings along its length (close together on the ribbed rings), meridians round it
  const lensRing = (y, r, n = 64) => { const q = []; for (let k = 0; k < n; k++){ const a = k/n*TAU; q.push([r*Math.cos(a), y, r*Math.sin(a)]); } loop(q); };
  const prof = [[36, 52], [37, 54], [36.5, 55], [36.5, 66], [35, 67], [35, 72], [35.5, 73], [35.5, 86], [33, 88], [33, 92], [30, 93], [30, 95]];
  for (let k = 0; k + 1 < prof.length; k++){ const [r0, y0] = prof[k], [r1, y1] = prof[k + 1], n = Math.max(1, Math.round((y1 - y0)/((y0 >= 55 && y1 <= 66) || (y0 >= 73 && y1 <= 86) ? 5 : 1e3)));
    for (let t = 0; t <= n; t++) lensRing(y0 + (y1 - y0)*t/n, r0 + (r1 - r0)*t/n); }
  for (let k = 0; k < 8; k++){ const a = k/8*TAU, c = Math.cos(a), sn = Math.sin(a); for (let q = 0; q + 1 < prof.length; q++) L([prof[q][0]*c, prof[q][1], prof[q][0]*sn], [prof[q + 1][0]*c, prof[q + 1][1], prof[q + 1][0]*sn]); }
  // the petal hood: from its mount out to a rim cut into two long petals (top and bottom) and two short ones
  // (no hood)
  // the front element: a shallow dome of glass in its retaining ring, and the iris behind it
  for (let r = 0; r <= 6; r++){ const rr = 31*(1 - r/6.4); lensRing(54 - 5*Math.cos(Math.asin(Math.min(1, rr/31))) + 5, rr, 48); }
  for (let k = 0; k < 0; k++){ const a = k/16*TAU; const q = []; for (let t = 0; t <= 6; t++){ const rr = 31*t/6; q.push([rr*Math.cos(a), 30 + 5 - 5*Math.cos(Math.asin(Math.min(1, rr/31))), rr*Math.sin(a)]); } for (let t = 0; t < 6; t++) L(q[t], q[t + 1]); }
  for (let k = 0; k < 9; k++){ const a = k/9*TAU, b = a + TAU/9; L([12*Math.cos(a), 62, 12*Math.sin(a)], [12*Math.cos(b), 62, 12*Math.sin(b)]); L([12*Math.cos(a), 62, 12*Math.sin(a)], [5*Math.cos(a + .7), 62, 5*Math.sin(a + .7)]); }
  // a prism meshed in a grid: its outline (x, z) at the front and back, contours between, lines along it, and both faces hatched
  const prism = (poly, y0, y1, step = 1e3, slices = 1) => {
    const per = []; for (let i = 0; i < poly.length; i++){ const a = poly[i], b = poly[(i + 1)%poly.length], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1])/step)); for (let t = 0; t < n; t++) per.push([a[0] + (b[0] - a[0])*t/n, a[1] + (b[1] - a[1])*t/n]); }
    for (let k = 0; k <= slices; k++){ const y = y0 + (y1 - y0)*k/slices; loop(per.map(([x, z]) => [x, y, z])); }
    for (const [x, z] of per) L([x, y0, z], [x, y1, z]);
    const xs = poly.map(q => q[0]), zs = poly.map(q => q[1]), cut = (fix, lo, hi, axis) => {           // scan lines across both faces
      for (let v = Math.ceil(lo/step)*step; v <= hi; v += step){ const hits = [];
        for (let i = 0; i < poly.length; i++){ const a = poly[i], b = poly[(i + 1)%poly.length], pa = a[axis], pb = b[axis]; if ((pa - v)*(pb - v) < 0){ const t = (v - pa)/(pb - pa); hits.push(a[1 - axis] + (b[1 - axis] - a[1 - axis])*t); } }
        hits.sort((a, b) => a - b); for (let h = 0; h + 1 < hits.length; h += 2) for (const y of [y0, y1]){ const A = axis ? [hits[h], y, v] : [v, y, hits[h]], B = axis ? [hits[h + 1], y, v] : [v, y, hits[h + 1]]; L(A, B); } } };
  };   // (outlines only: no grid on the faces)
  const rrect = (x0, x1, z0, z1, r, n = 5) => { const q = [], c = [[x1 - r, z0 + r, -Math.PI/2], [x1 - r, z1 - r, 0], [x0 + r, z1 - r, Math.PI/2], [x0 + r, z0 + r, Math.PI]];
    for (const [cx, cz, a0] of c) for (let t = 0; t <= n; t++){ const a = a0 + t/n*Math.PI/2; q.push([cx + r*Math.cos(a), cz + r*Math.sin(a)]); } return q; };
  // the body: its outline with the EVF hump rising from the top, from the mount face back to the rear panel
  { const q = rrect(-69, 69, -48, 48, 9), hump = [[20, 48], [16, 66], [-16, 66], [-20, 48]], i = q.findIndex(p => p[1] >= 48 && p[0] < 20);
    const body = [...q.slice(0, i), ...hump, ...q.slice(i)]; prism(body, 95, 141); }
  prism(rrect(38, 72, -46, 40, 10), 70, 95);                                                           // the grip, standing forward
  prism(rrect(-15, 15, 50, 64, 3), 141, 152, 4, 2);                                                          // the eyepiece
  { const q = []; for (let k = 0; k < 24; k++){ const a = k/24*TAU; q.push([12*Math.cos(a) - 0, 152, 7*Math.sin(a) + 57]); } loop(q); }   // its eyecup
  // the mount on the body's face: flange, bayonet, contacts
  for (const r of [34, 31, 27]){ const q = []; for (let k = 0; k < 64; k++){ const a = k/64*TAU; q.push([r*Math.cos(a), 95, r*Math.sin(a)]); } loop(q); }
  for (let k = 0; k < 10; k++){ const a = -1.1 + k*.07; L([25*Math.cos(a), 95.5, 25*Math.sin(a)], [23*Math.cos(a), 95.5, 23*Math.sin(a)]); }
  // the rear: the screen in its frame, gridded as the blueprint shows it; the control wheel, the buttons
  prism(rrect(-56, 26, -40, 16, 3), 141, 143, 7, 1);
  { const q = []; for (const r of [13, 9, 4]){ const c = []; for (let k = 0; k < 32; k++){ const a = k/32*TAU; c.push([45 + r*Math.cos(a), 143, -14 + r*Math.sin(a)]); } loop(c); } }
  for (const [x, z] of [[45, 14], [58, 2], [58, -30], [45, -36], [32, 26], [-60, 28], [-60, 18]]){ const c = []; for (let k = 0; k < 16; k++){ const a = k/16*TAU; c.push([x + 3.5*Math.cos(a), 142.5, z + 3.5*Math.sin(a)]); } loop(c); }
  // the top: mode dial with its ridges, a second dial, the shutter button in its collar on the grip, the hot shoe on the hump
  const dial = (x, y, z0, h, r, ridges) => { for (const zz of [z0, z0 + h]){ const c = []; for (let k = 0; k < 40; k++){ const a = k/40*TAU; c.push([x + r*Math.cos(a), y + r*Math.sin(a), zz]); } loop(c); }
    for (let k = 0; k < ridges; k++){ const a = k/ridges*TAU; L([x + r*Math.cos(a), y + r*Math.sin(a), z0], [x + r*Math.cos(a), y + r*Math.sin(a), z0 + h]); } };
  dial(-46, 118, 48, 7, 11, 36); dial(-46, 118, 55, 1.5, 7, 0); dial(40, 128, 48, 5, 9, 28); dial(54, 84, 40, 3, 9, 0); dial(54, 84, 43, 3, 5.5, 12);
  prism(rrect(-10, 10, 66, 69, 1), 108, 128, 5, 1);
  // strap lugs, the ports' doors on the left side, the tripod socket and battery door below
  for (const sx of [-1, 1]){ const c = []; for (let k = 0; k < 16; k++){ const a = k/16*TAU; c.push([sx*71, 118 + 4*Math.cos(a), 36 + 4*Math.sin(a)]); } loop(c); }
  for (const [z0, z1] of [[-34, -8], [-4, 22]]) loop([[-69.5, 104, z0], [-69.5, 134, z0], [-69.5, 134, z1], [-69.5, 104, z1]]);
  { const c = []; for (let k = 0; k < 20; k++){ const a = k/20*TAU; c.push([4*Math.cos(a), 118 + 4*Math.sin(a), -48.5]); } loop(c); }
  loop([[20, 100, -48.5], [62, 100, -48.5], [62, 136, -48.5], [20, 136, -48.5]]);
  for (const v of P){ v.x = -v.x; v.z = -v.z; }        // (turned half round its lens axis, so from the viewer's side it stands upright)
  g.add(seg(P, blue)); const h = seg(P, halo); h.position.y = H*(1 - 1.01); h.scale.setScalar(1.01); g.add(h);
  // the field of view: a four-sided shaft from the lens to the die, lit from within, brightest at the lens and along its edges, fading
  // toward the cell; seen through, so it barely veils what is under it
  const fg = new THREE.BufferGeometry(), o = [0, H, 0], cs = [[-HX, 0, -HZ], [HX, 0, -HZ], [HX, 0, HZ], [-HX, 0, HZ]], pos = [], uv = [];
  for (let k = 0; k < 4; k++){ const a = cs[k], b = cs[(k + 1)%4]; pos.push(...o, ...a, ...b); uv.push(.5, 0, 0, 1, 1, 1); }
  fg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); fg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  const fovM = new THREE.ShaderMaterial({ uniforms: { uOn: { value: 0 }, uT: U.uTime }, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.); }`,
    fragmentShader: `uniform float uOn, uT; varying vec2 vU;
      void main(){ float t = vU.y, e = t > 1e-3 ? abs(vU.x - .5)/(.5*t) : 0.;       // t: from the lens (0) to the die (1); e: across the face, 1 at its edges
        float edge = smoothstep(.8, 1., e), a = (.05 + .1*edge)*mix(1., .35, t) + .07*(1. - smoothstep(0., .12, t));
        a *= .9 + .1*sin(t*40. - uT*2.);                                       // (a slow shimmer down the shaft)
        gl_FragColor = vec4(vec3(.55, .8, 1.)*a*uOn, 1.); }` });
  const fm = new THREE.Mesh(fg, fovM); fm.renderOrder = 3; fm.frustumCulled = false; g.add(fm);
  return { g, blue, halo, fovM, t: 0, on: 0 };
})();
smrtCam.g.visible = true; smrtCam.blue.opacity = .6; smrtCam.fovM.uniforms.uOn.value = 1;

// ---- framing: the chapter's settled view (40 degrees up, pulled back to show the camera over the cell)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), .66, .5, .26); bloom.highPassUniforms.smoothWidth.value = .3;
composer.addPass(bloom); composer.addPass(new OutputPass());
function frameFor(w, h){
  camera.aspect = w/h; camera.updateProjectionMatrix();
  const v = camera.fov/2*DEG, hz = Math.atan(Math.tan(v)*camera.aspect), d = (w/h < .8 ? 2.05 : 2.45)/Math.sin(Math.min(v, hz)), e = 40*DEG;
  const t = new THREE.Vector3(0, 1.05, 0); camera.position.set(0, Math.sin(e)*d, Math.cos(e)*d).add(t); camera.lookAt(t);
  CU.uPR.value = h/1000; CU.uScale.value = 500/Math.tan(v);                // (sizes scale with the image, so every format looks the same)
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); composer.setSize(w, h);
}

// ---- the letters: a typeface from the list (Univia Pro too, when this device has it), sampled onto the wells
const has = fam => { const c = document.createElement('canvas').getContext('2d'), s = 'ALGEBRA wmi 0123';
  c.font = `72px monospace`; const a = c.measureText(s).width; c.font = `72px "${fam}", monospace`; return Math.abs(c.measureText(s).width - a) > .5; };
const FACES = { syn: ['Syncopate', 700, .04], mic: ['Michroma', 400, .06], orb: ['Orbitron', 600, .08], uni: ['Univia Pro', 500, .08] };
let FACE = FACES.syn;
function buildMask(text){
  const S = 8, NX = GX*S, NZ = GZ*S, c = document.createElement('canvas'); c.width = NX; c.height = NZ;
  const x = c.getContext('2d'), [fam, wt, ls] = FACE, str = (text || ' ').toUpperCase(), squash = Math.sin(40*DEG);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const set = fs => { x.font = `${wt} ${fs}px "${fam}"`; if ('letterSpacing' in x) x.letterSpacing = `${fs*ls}px`; return x.measureText(str).width; };
  let fs = 200; fs = Math.min(fs*NX*.86/Math.max(set(fs), 1), NZ*.42*squash); set(fs);
  // stretched in depth by 1/sin(40 degrees), so from the camera's angle the letters stand in their true proportions
  x.save(); x.translate(NX/2 + (ls*fs)/2, NZ/2); x.scale(1, 1/squash); x.fillText(str, 0, 0); x.restore();
  const px = x.getImageData(0, 0, NX, NZ).data;
  for (let j = 0; j < GZ; j++) for (let i = 0; i < GX; i++){ let s = 0;
    for (let y = 0; y < S; y++) for (let xx = 0; xx < S; xx++) s += px[((j*S + y)*NX + i*S + xx)*4 + 3];
    maskData[j*GX + i] = s/(S*S*255) > .5 ? 255 : 0; }
  maskTex.needsUpdate = true;
}

// ---- the preview, sized to the format inside the page
let FMT = [3840, 2160];
function fit(){
  const st = cv.parentElement.getBoundingClientRect(), ar = FMT[0]/FMT[1];
  let w = st.width - 32, h = w/ar; if (h > st.height - 8){ h = st.height - 8; w = h*ar; }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = `${Math.round(w)}px`; cv.style.height = `${Math.round(h)}px`;
  frameFor(Math.round(w*dpr), Math.round(h*dpr));
}
addEventListener('resize', fit);
let last = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min(.05, (t - last)/1000); last = t;
  if (!RM){ U.uTime.value += dt; CU.uCellT.value += dt*.35; }
  smrtCam.halo.opacity = .05*(.92 + .08*Math.sin(U.uTime.value*3.1));
  composer.render();
});

// ---- controls (on claude.ai the image is saved through the viewer's own save prompt)
const DL = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
const seg = (id, on) => $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  for (const o of $(id).querySelectorAll('button')) o.setAttribute('aria-pressed', o === b); on(b); });
seg('fmt', b => { FMT = b.dataset.f.split('x').map(Number); fit(); });
seg('pal', b => { CU.uWhite.value = +b.dataset.p; });
seg('face', b => { FACE = FACES[b.dataset.t]; buildMask($('txt').value); });
$('txt').addEventListener('input', e => buildMask(e.target.value));
$('save').addEventListener('click', () => {
  const [w, h] = FMT; frameFor(w, h); composer.render();
  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob), name = `algebra-smrt-${w}x${h}.png`;
    $('shotImg').src = url; $('shotTxt').textContent = `${w} × ${h} px. Right-click or long-press the image to save it.`; $('shot').hidden = false;
    fit();
    DL.then(dl => {
      if (dl) dl.save({ filename: name, data: blob }).then(() => { $('shotTxt').textContent = `${w} × ${h} px. Saved as ${name}.`; })
        .catch(e => { if (e?.code !== 'declined') $('shotTxt').textContent = `${w} × ${h} px. Saving isn't available here, so right-click or long-press the image to save it.`; });
      else { try { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); } catch (e) {} }   // (opened on its own, outside claude.ai)
    });
  }, 'image/png');
});
$('close').addEventListener('click', () => { $('shot').hidden = true; });

// ---- start
(async () => {
  await Promise.all(Object.values(FACES).slice(0, 3).map(([f, w]) => document.fonts.load(`${w} 100px "${f}"`).catch(() => {})));
  const uni = ['Univia Pro', 'univia-pro'].find(has);
  if (uni) { FACES.uni[0] = uni; $('faceUni').hidden = false; }
  buildMask($('txt').value); fit();
})();
</script>
